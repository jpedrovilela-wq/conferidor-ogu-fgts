<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conferidor de Empreendimentos</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <main class="hub">
    <p class="eyebrow">Coordenação de Planejamento - DPP - SNH</p>
    <h1>Conferidor de Empreendimentos</h1>
    <p class="intro">Selecione o grupo de dados que deseja conferir.</p>
    <fieldset class="selector">
      <legend>Grupo de dados</legend>
      <label><input type="radio" name="grupo" value="ogu" /> <span>OGU</span><small>Arquivo CSV ou TXT de empreendimentos</small></label>
      <label><input type="radio" name="grupo" value="fgts" checked /> <span>FGTS</span><small>Arquivo CSV ou TXT de contratações</small></label>
      <label><input type="radio" name="grupo" value="rcb" /> <span>Reforma Casa Brasil</span><small>Arquivo CSV ou TXT de contratações</small></label>
      <label><input type="radio" name="grupo" value="prioritarios" /> <span>Dados Prioritários</span><small>Empreendimentos e entregas — Caixa e BB</small></label>
    </fieldset>
    <p id="arquivo-origem" class="intro"><strong>Arquivo esperado:</strong> envie o CSV ou TXT extraído de <code>view_exportar_fgts_casa_civil</code>.</p>
  </main>
  <iframe id="rotina" title="Rotina de conferência FGTS" src="fgts.html"></iframe>
  <script src="hub.js?v=6"></script>
</body>
</html>
